name: Build Orange Cloud Android (OSS)

on:
  workflow_dispatch:
    inputs:
      oauth_client_id:
        description: 'OAuth Client ID (leave empty to skip)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Remove daemon toolchain lock
        run: |
          rm -f apps/android/gradle/gradle-daemon-jvm.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: '36'
          build-tools-version: '36.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Inject OAuth Client ID
        if: github.event.inputs.oauth_client_id != ''
        run: |
          echo "OAUTH_CLIENT_ID=${{ github.event.inputs.oauth_client_id }}" >> apps/android/local.properties
          echo "Injected OAuth Client ID: ${{ github.event.inputs.oauth_client_id }}"

      - name: Build OSS Debug APK
        working-directory: apps/android
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-sdk-path }}
          GRADLE_OPTS: -Xmx6g -XX:MaxMetaspaceSize=1g
        run: |
          if [ ! -f local.properties ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi
          rm -f gradle/gradle-daemon-jvm.properties 2>/dev/null || true
          if ! grep -q "^android.useAndroidX" gradle.properties 2>/dev/null; then
            echo "android.useAndroidX=true" >> gradle.properties
          fi
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          java -version 2>&1
          echo "---"
          ./gradlew :app:assembleOssDebug --no-daemon --stacktrace 2>&1 | tail -100

      - name: Locate and upload APK
        working-directory: apps/android
        run: |
          find . -name "*.apk" -not -path "*/intermediates/*" 2>/dev/null
          APK=$(find . -name "app-oss-debug.apk" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -not -path "*/intermediates/*" | head -1)
          fi
          echo "Found: $APK"
          if [ -n "$APK" ]; then
            cp "$APK" OrangeCloud-oss-debug.apk
            ls -la OrangeCloud-oss-debug.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeCloud-oss-debug
          path: apps/android/OrangeCloud-oss-debug.apk
          if-no-files-found: error
